openapi: 3.0.3
info:
  title: Product API
  version: 1.0.0
  description: |
    API for products and prices in different currencies.

    Money is a string with two decimals, for example "12.50".
    exchange_rate uses eight decimals. It means how many US dollars one unit of the currency is worth.

    Get a token with POST /auth/login. Then send Authorization: Bearer {token}.
    The token lasts 24 hours. There is no public register.
    Demo user: demo@example.com / password.
servers:
  - url: http://localhost:8000
tags:
  - name: Auth
  - name: Products
  - name: Prices
  - name: Currencies
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Get a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: demo@example.com
              password: password
      responses:
        '200':
          description: Token created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/logout:
    post:
      tags: [Auth]
      summary: Delete the current token
      responses:
        '204':
          description: Token deleted
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/me:
    get:
      tags: [Auth]
      summary: Current user
      responses:
        '200':
          description: Logged in user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /currencies:
    get:
      tags: [Currencies]
      summary: List currencies
      responses:
        '200':
          description: List of currencies
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Currency'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /currencies/{currency}:
    get:
      tags: [Currencies]
      summary: Show a currency
      parameters:
        - $ref: '#/components/parameters/CurrencyId'
      responses:
        '200':
          description: Currency
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Currency'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /products:
    get:
      tags: [Products]
      summary: List products
      parameters:
        - name: search
          in: query
          schema:
            type: string
            maxLength: 255
          description: Search in the name and the description. Upper and lower case are the same.
        - name: currency_id
          in: query
          schema:
            type: integer
          description: Only products that use this currency as the base one.
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Product list, with pages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
            example:
              name: Desk Lamp
              description: A small desk lamp.
              price: "42.00"
              currency_id: 1
              tax_cost: "4.20"
              manufacturing_cost: "9.00"
      responses:
        '201':
          description: Product was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
  /products/{product}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Products]
      summary: Show a product
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Products]
      summary: Replace a product
      description: You must send all fields. This replaces the product. It is not a small update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '200':
          description: Product was updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Products]
      summary: Delete a product
      description: This also deletes the extra prices.
      responses:
        '204':
          description: Product was deleted
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /products/{product}/prices:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Prices]
      summary: List prices for a product
      responses:
        '200':
          description: Extra prices. The base price stays on the product.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductPrice'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Prices]
      summary: Add a price in another currency
      description: |
        You cannot use the product base currency here.
        You also cannot add the same currency two times.
        price_in_product_currency changes this price into the product currency. It uses USD in the middle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductPriceRequest'
            example:
              currency_id: 2
              price: "11.50"
      responses:
        '201':
          description: Price was created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProductPrice'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ProductId:
      name: product
      in: path
      required: true
      schema:
        type: integer
    CurrencyId:
      name: currency
      in: path
      required: true
      schema:
        type: integer
  responses:
    Unauthenticated:
      description: No token, or the token is wrong
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          example:
            message: Unauthenticated.
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
          example:
            message: Product not found.
    ValidationError:
      description: The data is not valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    TooManyRequests:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
  schemas:
    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string
    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    LoginResponse:
      type: object
      required: [token_type, token, user]
      properties:
        token_type:
          type: string
          example: Bearer
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
    Currency:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        symbol:
          type: string
          example: USD
        exchange_rate:
          type: string
          example: "1.00000000"
    ProductRequest:
      type: object
      required: [name, description, price, currency_id, tax_cost, manufacturing_cost]
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 5000
        price:
          type: string
          description: Price in the base currency.
          example: "42.00"
        currency_id:
          type: integer
        tax_cost:
          type: string
          example: "4.20"
        manufacturing_cost:
          type: string
          example: "9.00"
    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        price:
          type: string
        tax_cost:
          type: string
        manufacturing_cost:
          type: string
        total_cost:
          type: string
          description: Sum of price, tax and manufacturing cost. It is calculated. It is not saved in the database.
        currency_id:
          type: integer
        currency:
          $ref: '#/components/schemas/Currency'
        prices:
          type: array
          items:
            $ref: '#/components/schemas/ProductPrice'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProductEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Product'
    ProductPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        links:
          type: object
        meta:
          type: object
          properties:
            current_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
    ProductPriceRequest:
      type: object
      required: [currency_id, price]
      properties:
        currency_id:
          type: integer
        price:
          type: string
          example: "11.50"
    ProductPrice:
      type: object
      properties:
        id:
          type: integer
        product_id:
          type: integer
        currency_id:
          type: integer
        price:
          type: string
        price_in_product_currency:
          type: string
          description: This price in the product currency.
        currency:
          $ref: '#/components/schemas/Currency'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
security:
  - bearerAuth: []
